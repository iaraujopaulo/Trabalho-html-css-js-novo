<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/forgot.css">
    <title>VOLTS MOTORS</title>
    <link rel="stylesheet" href="css/rodape.css">
</head>
<body data-page="senha">
    <div class="menu-recuperacao">
        <form id="form-senha">
            <div class="aside-logo">
                <h1>VOLTS MOTORS</h1>
                <h2>Alteração de senha</h2>
            </div>
            <div class="itens">
                <input type="email" name="email" id="gmail" required>
                <label for="gmail">Digite seu email</label>
            </div>
            <div class="itens">
                <input type="password" name="senha" id="senha" required>
                <label for="senha">Nova senha</label>
            </div>
            <div class="itens">
                <input type="password" name="confirmar" id="repeat" required>
                <label for="repeat"> Confirmar nova senha</label>
            </div>
            <p id="msg" class="mensagem" role="status"></p>
            <a href="login.html">Voltar para login</a>
            <button type="submit" >Aceitar</button>
        </form>
    </div>
    <p class="direitos">&copy; 2026 VOLTS MOTORS. Todos os direitos reservados.</p>
<script src="js/app.js"></script>
</body>
</html>
