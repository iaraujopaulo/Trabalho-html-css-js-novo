<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/paginas.css">
    <title>VOLTS MOTORS</title>
</head>
<body data-page="contato">
    <header id="topo"></header>
    <main>
<h1>Fale com a VOLTS MOTORS</h1>
<p class="sub">Dúvidas, reclamações ou elogios: envie sua mensagem.</p>
<form id="form-contato" class="formulario">
<label>Nome completo<input type="text" name="nome" required></label>
<label>E-mail<input type="email" name="email" required></label>
<label>Telefone com DDD<input type="tel" id="telefone" name="telefone" placeholder="(85) 99999-9999" pattern="\(\d{2}\) \d{4,5}-\d{4}" title="Use o formato (DD) 99999-9999" required></label>
<label>Mensagem<textarea name="mensagem" placeholder="Escreva sua dúvida, reclamação ou elogio" required></textarea></label>
<p id="msg" class="mensagem" role="status"></p>
<button type="submit" class="btn-cta">Enviar</button>
</form>
    </main>
    <footer>&copy; 2026 VOLTS MOTORS. Todos os direitos reservados.</footer>
    <script src="js/app.js"></script>
</body>
</html>
